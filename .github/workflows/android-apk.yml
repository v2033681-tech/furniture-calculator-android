name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp icon-*.png icon.svg www/
          node -e "let c=require('./capacitor.config.json');c.webDir='www';require('fs').writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"

      - run: npx cap add android

      - run: npx cap sync android

      - run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: furniture-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
